<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homepage</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1> Gaming Zone </h1>
        <p> Co tam Steam, u nas tylko najnowsze gry! </p>
    </header>

    <section class="promocje">
        <h2> Promocje tygodnia </h2>
        <div class="promo-box">
            <img src="https://cdn.cloudflare.steamstatic.com/steam/apps/730/header.jpg" alt="CS2">
            <div class="promo-info">
                <h3> Counter Strike 2</h3>
                <p><span class="old-price">129,99 zł</span> <span class="new-price">89,99zł</span></p>
            </div>
        </div>
    </section>

    <section class="list-gier">
        <h2> Lista gier </h2>
        <div class="gry">
            <div class="gra">
                <img src="https://cdn.cloudflare.steamstatic.com/steam/apps/271590/header.jpg" alt="GTA V">
                <h3>GTA V</h3>
                <p class="cena">99,99zł</p>
            </div>
            <div class="gra">
                <img src="https://cdn.cloudflare.steamstatic.com/steam/apps/1174180/header.jpg" alt="RDR2">
                <h3>Red Dead Redemption 2</h3>
                <p class="cena">259,99zł</p>
            </div>
            <div class="gra">
                    <img src="https://cdn.cloudflare.steamstatic.com/steam/apps/812140/header.jpg" alt="Assassin’s Creed Odyssey"> 
                <h3>Assassin's Creed Odyssey</h3>
                <p class="cena">89,99zł</p>
            </div>
            <div class="gra">
                <img src="https://cdn.cloudflare.steamstatic.com/steam/apps/578080/header.jpg" alt="PUBG">
                <h3>PUBG</h3>
                <p class="cena">59,99zł</p>
            </div>
        </div>
    </section>

    <footer>
        <p>Gaming Zone - Projekt Platona Archakova</p>
    </footer>
</body>
</html>
